<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hydrangea Doctor</title>
  <meta name="theme-color" content="#7b5ea7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hydrangea">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌸 <span data-i18n="title">Hydrangea Doctor</span></h1>
    <div class="header-right">
      <div id="langs" class="langs" role="group" aria-label="Language">
        <button data-lang="en">EN</button><button data-lang="ru">РУ</button><button data-lang="ky">КЫ</button>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main>
    <section id="settings" class="card" hidden>
      <h2><span data-i18n="aboutPlant">About your plant</span>: <span id="settingsPlant"></span></h2>
      <label id="speciesRow"><span data-i18n="type">Type</span>
        <select id="species"></select>
      </label>
      <div class="row">
        <label><span data-i18n="age">Age (years)</span><input id="age" type="number" inputmode="decimal" min="0" step="1" placeholder="4"></label>
        <label><span data-i18n="height">Height (cm)</span><input id="height" type="number" inputmode="decimal" min="0" step="5" placeholder="120"></label>
      </div>
      <p class="hint" data-i18n="savedHint">Saved on this phone. The app also uses your location for the weather.</p>
      <button id="saveSettings" class="primary" data-i18n="save">Save</button>
    </section>

    <section id="capture" class="card">
      <p class="lead" data-i18n-html="lead">Add photos of <b>one plant</b>: a <b>leaf close-up</b> (for health) and the <b>whole plant</b> (for trimming).</p>
      <label><span data-i18n="plantLabel">Plant</span>
        <select id="plant"></select>
      </label>
      <div id="thumbs" class="thumbs"></div>
      <div class="row">
        <label class="btn" for="camera">📷 <span data-i18n="takePhoto">Take photo</span></label>
        <label class="btn" for="gallery">🖼️ <span data-i18n="gallery">Gallery</span></label>
      </div>
      <input id="camera" type="file" accept="image/*" capture="environment" hidden>
      <input id="gallery" type="file" accept="image/*" multiple hidden>
      <p id="count" class="hint center"></p>
      <button id="check" class="primary" disabled data-i18n="check">Check my plant</button>
    </section>

    <section id="loading" class="card center" hidden><div class="spinner"></div><p data-i18n="looking">Looking at your plant…</p><p id="slow" class="hint" data-i18n="slow" hidden></p></section>
    <section id="result" class="card" hidden>
      <p id="plantLine" class="plant-line"></p>
      <div id="badge" class="badge"></div>
      <h2 id="headline"></h2>
      <p id="howFar"></p>
      <ul id="notes"></ul>
      <p id="weather" class="hint"></p>
      <details><summary data-i18n="whatSaw">What the model saw</summary><p id="seen" class="hint"></p></details>
      <button id="again" class="secondary" data-i18n="again">Check another plant</button>
    </section>
    <section id="error" class="card error" hidden></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
